[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "smartsite-ai"
version = "0.1.0"
description = "SmartSite AI service foundation and capability contract"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jcs==0.2.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
vision = ["ultralytics==8.4.155", "supervision==0.30.4"]

[project.scripts]
smartsite-ai = "smartsite_ai.main:run"

[dependency-groups]
dev = [
  "httpx2==2.13.0",
  "jsonschema[format-nongpl]==4.23.0",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smartsite_ai"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "smartsite_ai/contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
  "error",
  # Starlette 1.6's TestClient uses this deprecated AnyIO compatibility alias.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
