[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "smartsite-ai"
version = "0.1.0"
description = "SmartSite AI service foundation and capability contract"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jcs==0.2.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
vision = [
  "pyyaml==6.0.3",
  "supervision==0.30.4",
  "torch==2.14.0+cpu",
  "torchvision==0.29.0+cpu",
  "ultralytics==8.4.155",
]
cuda126 = [
  "pyyaml==6.0.3",
  "supervision==0.30.4",
  "torch==2.14.0+cu126",
  "torchvision==0.29.0+cu126",
  "ultralytics==8.4.155",
]

[project.scripts]
smartsite-ai = "smartsite_ai.main:run"
smartsite-ai-detect-video = "smartsite_ai.tools.detect_video:main"
smartsite-ai-evaluate = "smartsite_ai.tools.evaluate:main"
smartsite-ai-prepare-ppe-dataset = "smartsite_ai.tools.prepare_ppe_dataset:main"
smartsite-ai-train-ppe = "smartsite_ai.tools.train_ppe:main"

[dependency-groups]
dev = [
  "httpx2==2.13.0",
  "jsonschema[format-nongpl]==4.23.0",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smartsite_ai"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "smartsite_ai/contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
  "error",
  # Starlette 1.6's TestClient uses this deprecated AnyIO compatibility alias.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "vision" },
  { index = "pytorch-cu126", extra = "cuda126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "vision" },
  { index = "pytorch-cu126", extra = "cuda126" },
]

[tool.uv]
conflicts = [[{ extra = "vision" }, { extra = "cuda126" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
